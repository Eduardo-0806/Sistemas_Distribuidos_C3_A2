services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  inferencia:
    build: ./inferencia
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis: {condition: service_healthy}

  worker:
    build: ./worker
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis: {condition: service_healthy}

  gateway:
    build: ./gateway
    ports: ["8000:8000"]
    environment:
      - URL_INFERENCIA=http://inferencia:8001
      - JWT_SEGREDO=${JWT_SEGREDO:-troque-este-segredo}
      - JWT_EXPIRACAO_MIN=${JWT_EXPIRACAO_MIN:-30}
      - AUTH_USUARIO=${AUTH_USUARIO:-admin}
      - AUTH_SENHA=${AUTH_SENHA:-troque-esta-senha}
    depends_on: [inferencia]

# Observe: os servicos se referenciam pelo NOME (inferencia, redis),
# nunca por IP fixo. Isso e descoberta de servicos. (Aula 14)
