# Plataforma de IA como Servico - sistema inteiro com UM comando:
#
#     docker compose up --build
#
# Nao precisa de .env para subir (todas as variaveis tem padrao). Para trocar
# segredos/limites, copie .env.example para .env: o compose le o .env sozinho.
#
#   cliente --HTTP--> gateway:8000 --HTTP--> inferencia:8001 --RPUSH--> redis
#                    (JWT, rate limit)  |                                 |
#                                       |    worker (N replicas) <--BLPOP-+
#                                       |
#                                       +--HTTP--> vetorial:8002 (indice em volume)
#
# A API do gateway fica em 8000; a interface local do Jaeger fica em 16686.
# Os servicos de aplicacao ficam na rede interna e se encontram pelo NOME do
# servico (descoberta de servicos, Aula 14) - nunca por IP fixo.

x-redis-url: &redis-url redis://redis:6379/0
x-otel-env: &otel-env
  OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
  OTEL_PROPAGATORS: tracecontext,baggage
  OTEL_PYTHON_INSTRUMENTATION_SANITIZE_REDIS: "true"
  OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: .*/saude

services:
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.23.0
    ports: ["16686:16686"]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # AOF: a fila e os resultados sobrevivem a um restart do Redis.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-dados:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  inferencia:
    build: {context: ., dockerfile: inferencia/Dockerfile}
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: inferencia
      REDIS_URL: *redis-url
      RESULTADO_TTL_S: ${RESULTADO_TTL_S:-3600}
    depends_on:
      redis: {condition: service_healthy}
      jaeger: {condition: service_started}
    restart: unless-stopped

  worker:
    build: {context: ., dockerfile: worker/Dockerfile}
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: worker
      REDIS_URL: *redis-url
      RESULTADO_TTL_S: ${RESULTADO_TTL_S:-3600}
    depends_on:
      redis: {condition: service_healthy}
      jaeger: {condition: service_started}
    # Varios workers consomem a MESMA fila: cada tarefa vai para um so.
    # Mude com WORKER_REPLICAS no .env ou: docker compose up --scale worker=4
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    restart: unless-stopped

  vetorial:
    build: ./vetorial
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: vetorial
    depends_on:
      jaeger: {condition: service_started}
    volumes:
      # O indice (textos + vetores) persiste entre restarts e recriacoes.
      - vetorial-dados:/dados
    restart: unless-stopped

  gateway:
    build: ./gateway
    ports: ["${GATEWAY_PORTA:-8000}:8000"]
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: gateway
      URL_INFERENCIA: http://inferencia:8001
      URL_VETORIAL: http://vetorial:8002
      REDIS_URL: *redis-url
      JWT_SEGREDO: ${JWT_SEGREDO:-troque-este-segredo}
      JWT_EXPIRACAO_MIN: ${JWT_EXPIRACAO_MIN:-30}
      AUTH_USUARIO: ${AUTH_USUARIO:-admin}
      AUTH_SENHA: ${AUTH_SENHA:-troque-esta-senha}
      LIMITE_REQ_POR_MIN: ${LIMITE_REQ_POR_MIN:-30}
      LIMITE_LOGIN_POR_MIN: ${LIMITE_LOGIN_POR_MIN:-10}
      SERVICO_TIMEOUT_S: ${SERVICO_TIMEOUT_S:-10}
      SERVICO_MAX_TENTATIVAS: ${SERVICO_MAX_TENTATIVAS:-3}
      SERVICO_BACKOFF_INICIAL_S: ${SERVICO_BACKOFF_INICIAL_S:-0.2}
      SERVICO_BACKOFF_MAX_S: ${SERVICO_BACKOFF_MAX_S:-2}
      DISJUNTOR_LIMITE_FALHAS: ${DISJUNTOR_LIMITE_FALHAS:-5}
      DISJUNTOR_DESCANSO_S: ${DISJUNTOR_DESCANSO_S:-30}
    depends_on:
      redis: {condition: service_healthy}
      # So aceita trafego depois que a inferencia passou no healthcheck.
      inferencia: {condition: service_healthy}
      vetorial: {condition: service_healthy}
      jaeger: {condition: service_started}
    restart: unless-stopped

volumes:
  redis-dados:
  vetorial-dados:
